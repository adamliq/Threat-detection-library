<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>

<title>Threat Detection Library</title>
<meta name="description" content="A searchable, self-contained library of platform-specific threat detections: technique, data sources, detection logic, MITRE ATT&amp;CK mapping, false positives, and references.">
<style>
  :root {
    --bg: #f5f6f8;
    --bg-elevated: #ffffff;
    --bg-inset: #eef0f3;
    --border: #dde1e6;
    --text: #1a1d23;
    --text-muted: #5b6270;
    --text-faint: #8990a0;
    --accent: #a4212e;
    --accent-text: #ffffff;
    --link: #a4212e;
    --code-bg: #1a1d23;
    --code-text: #e7e9ee;
    --code-accent: #ff9d9d;
    --badge-critical-bg: #fbdede;
    --badge-critical-text: #8f1d26;
    --badge-high-bg: #fde6d3;
    --badge-high-text: #8a4a11;
    --badge-medium-bg: #fdf1cd;
    --badge-medium-text: #7a5c05;
    --badge-low-bg: #e2f0e5;
    --badge-low-text: #1f6b34;
    --badge-info-bg: #e3e9fb;
    --badge-info-text: #2a3f8f;
    --shadow: 0 1px 2px rgba(20,22,28,0.06), 0 4px 14px rgba(20,22,28,0.06);
    --shadow-lg: 0 10px 40px rgba(20,22,28,0.18);
    --focus-ring: 0 0 0 3px rgba(164,33,46,0.35);
    color-scheme: light;
  }
  :root:not([data-theme="light"]) {
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151a;
      --bg-elevated: #1c1e25;
      --bg-inset: #21232b;
      --border: #313440;
      --text: #edeef2;
      --text-muted: #a6acbb;
      --text-faint: #767c8c;
      --accent: #ef5d68;
      --accent-text: #1a0507;
      --link: #ff8790;
      --code-bg: #0f1015;
      --code-text: #dbe0ea;
      --code-accent: #ff9d9d;
      --badge-critical-bg: #4a1418;
      --badge-critical-text: #ff9ba2;
      --badge-high-bg: #4a2c0f;
      --badge-high-text: #ffb877;
      --badge-medium-bg: #443c0e;
      --badge-medium-text: #f2d876;
      --badge-low-bg: #123a22;
      --badge-low-text: #7fe0a0;
      --badge-info-bg: #1c2748;
      --badge-info-text: #a9bcf5;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
      --shadow-lg: 0 20px 60px rgba(0,0,0,0.55);
      --focus-ring: 0 0 0 3px rgba(239,93,104,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151a;
    --bg-elevated: #1c1e25;
    --bg-inset: #21232b;
    --border: #313440;
    --text: #edeef2;
    --text-muted: #a6acbb;
    --text-faint: #767c8c;
    --accent: #ef5d68;
    --accent-text: #1a0507;
    --link: #ff8790;
    --code-bg: #0f1015;
    --code-text: #dbe0ea;
    --code-accent: #ff9d9d;
    --badge-critical-bg: #4a1418;
    --badge-critical-text: #ff9ba2;
    --badge-high-bg: #4a2c0f;
    --badge-high-text: #ffb877;
    --badge-medium-bg: #443c0e;
    --badge-medium-text: #f2d876;
    --badge-low-bg: #123a22;
    --badge-low-text: #7fe0a0;
    --badge-info-bg: #1c2748;
    --badge-info-text: #a9bcf5;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.55);
    --focus-ring: 0 0 0 3px rgba(239,93,104,0.4);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }
  a { color: var(--link); }
  button, input, select { font-family: inherit; }
  :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 4px; }

  code, pre {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }

  .app-header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
  }
  .app-header-inner {
    max-width: 1320px; margin: 0 auto;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(145deg, var(--accent), #6d1a22);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .brand .sub { font-size: 12px; color: var(--text-faint); }

  .search-wrap { flex: 1 1 320px; min-width: 220px; position: relative; }
  .search-wrap input {
    width: 100%; padding: 9px 14px 9px 36px;
    background: var(--bg-inset); border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 14px;
  }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
  .search-wrap .kbd-hint {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px;
    pointer-events: none;
  }

  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .icon-btn, .btn {
    background: var(--bg-inset); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 550; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .icon-btn { padding: 8px; }
  .icon-btn:hover, .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }

  .layout { max-width: 1320px; margin: 0 auto; display: flex; gap: 22px; padding: 20px; align-items: flex-start; }
  .sidebar {
    width: 250px; flex-shrink: 0; position: sticky; top: 78px;
    max-height: calc(100vh - 96px); overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .filter-group h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-faint); margin: 0 0 8px;
  }
  .filter-option {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13.5px; color: var(--text-muted);
  }
  .filter-option:hover { background: var(--bg-inset); color: var(--text); }
  .filter-option.active { background: var(--bg-inset); color: var(--text); font-weight: 600; }
  .filter-option .count { font-size: 11.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .filter-option.active .count { color: var(--text-muted); }
  .clear-filters { font-size: 12px; color: var(--link); background: none; border: none; cursor: pointer; padding: 0; }

  .main { flex: 1; min-width: 0; }
  .results-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .results-count { font-size: 13px; color: var(--text-muted); }
  .active-filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--badge-info-bg); color: var(--badge-info-text);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; border: none;
  }
  .filter-chip .x { opacity: 0.7; }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
  .card {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow); transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .card:hover { border-color: var(--accent); }
  .card:active { transform: scale(0.997); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .card-title { font-size: 14.5px; font-weight: 650; line-height: 1.35; }
  .badge {
    display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 999px; flex-shrink: 0; white-space: nowrap;
  }
  .badge.critical { background: var(--badge-critical-bg); color: var(--badge-critical-text); }
  .badge.high { background: var(--badge-high-bg); color: var(--badge-high-text); }
  .badge.medium { background: var(--badge-medium-bg); color: var(--badge-medium-text); }
  .badge.low, .badge.informational { background: var(--badge-low-bg); color: var(--badge-low-text); }
  .card-desc { font-size: 12.8px; color: var(--text-muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 11px; color: var(--text-muted); background: var(--bg-inset); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 999px;
  }
  .tag.mitre { color: var(--badge-info-text); background: var(--badge-info-bg); border-color: transparent; font-weight: 600; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--text-faint); margin-top: auto; padding-top: 2px; }

  .empty-state { text-align: center; padding: 70px 20px; color: var(--text-faint); }
  .empty-state h3 { color: var(--text); margin-bottom: 6px; }

  .overlay {
    position: fixed; inset: 0; background: rgba(10,10,14,0.55); backdrop-filter: blur(2px);
    display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 100; overflow-y: auto;
  }
  .overlay[hidden] { display: none; }
  .detail-panel {
    background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px;
    max-width: 860px; width: 100%; box-shadow: var(--shadow-lg); margin-bottom: 40px;
  }
  .detail-header {
    padding: 22px 26px 18px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
    position: sticky; top: 0; background: var(--bg-elevated); border-radius: 16px 16px 0 0; z-index: 2;
  }
  .detail-title { font-size: 19px; font-weight: 700; margin: 0 0 8px; line-height: 1.3; }
  .detail-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .detail-body { padding: 22px 26px 30px; display: flex; flex-direction: column; gap: 22px; }
  .detail-section h4 {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint);
    margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between;
  }
  .detail-section p { margin: 0; font-size: 14px; color: var(--text); }
  .detail-section ul { margin: 0; padding-left: 20px; font-size: 13.5px; color: var(--text-muted); }
  .detail-section li { margin-bottom: 4px; }
  .code-block {
    background: var(--code-bg); color: var(--code-text); border-radius: 10px; padding: 14px 16px;
    font-size: 12.6px; overflow-x: auto; white-space: pre; position: relative; line-height: 1.6;
  }
  .code-block .cmd { color: var(--code-accent); }
  .copy-btn {
    position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,0.08); color: var(--code-text);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 4px 9px; font-size: 11px; cursor: pointer;
  }
  .copy-btn:hover { background: rgba(255,255,255,0.16); }
  .kv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .kv-table td { padding: 7px 0; border-top: 1px solid var(--border); vertical-align: top; }
  .kv-table td:first-child { color: var(--text-faint); width: 150px; padding-right: 12px; }
  .data-source-item { padding: 10px 0; border-top: 1px solid var(--border); }
  .data-source-item:first-child { border-top: none; padding-top: 0; }
  .data-source-item .ds-name { font-weight: 650; font-size: 13.5px; }
  .data-source-item .ds-path { font-size: 11.5px; color: var(--text-faint); font-family: ui-monospace, monospace; margin-left: 8px; }
  .data-source-item .ds-desc { font-size: 12.8px; color: var(--text-muted); margin-top: 3px; }
  .ref-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .ref-list a { font-size: 13px; text-decoration: none; }
  .ref-list a:hover { text-decoration: underline; }
  .related-chip {
    display: inline-block; font-size: 12px; padding: 5px 10px; border-radius: 8px; background: var(--bg-inset);
    border: 1px solid var(--border); color: var(--text); cursor: pointer; margin: 0 6px 6px 0;
  }
  .related-chip:hover { border-color: var(--accent); }
  .close-btn {
    background: var(--bg-inset); border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); flex-shrink: 0;
  }
  .close-btn:hover { color: var(--text); border-color: var(--accent); }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(0);
    background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px;
    font-weight: 600; z-index: 200; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  footer { text-align: center; padding: 30px 20px 50px; color: var(--text-faint); font-size: 12px; }
  footer a { color: var(--text-faint); }

  @media (max-width: 880px) {
    .sidebar { display: none; }
    .layout { padding: 14px; }
  }
</style>
</head>

<script>

      document.documentElement.removeAttribute("data-theme");
    }

    var effectiveDark = current ? current === "dark" : prefersDark;
    var next = effectiveDark ? "light" : "dark";

  /* ---------------------------- Helpers ---------------------------- */

    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {

    var counts = {};

  function allMethods() {

  }
  function allDataSources() {
    var set = {};
    DATA.forEach(function (d) { (d.data_sources || []).forEach(function (ds) { set[ds.name] = true; }); });
    return Object.keys(set).sort();
  }
  var SEVERITY_ORDER = ["critical", "high", "medium", "low", "informational"];

  function matchesQuery(d, q) {
    if (!q) return true;
    q = q.toLowerCase();
    var haystack = [
      d.title, d.description, d.spl, d.cli_reference, d.method,
      (d.tags || []).join(" "),
      (d.mitre_attack.techniques || []).map(function (t) { return t.id + " " + t.name; }).join(" "),
      (d.data_sources || []).map(function (s) { return s.name; }).join(" ")

    return haystack.indexOf(q) !== -1;
  }
  function matchesFilters(d) {
    if (state.tactic && (d.mitre_attack.tactics || []).every(function (t) { return t.name !== state.tactic; })) return false;

    if (state.method && d.method !== state.method) return false;
    if (state.dataSource && (d.data_sources || []).every(function (s) { return s.name !== state.dataSource; })) return false;

    return DATA.filter(function (d) { return matchesQuery(d, state.query) && matchesFilters(d); });

    var wrap = document.getElementById("active-filters");
    var chips = [];
    if (state.tactic) chips.push({ k: "tactic", label: "Tactic: " + state.tactic });

    });
  }

  function renderGrid() {
    var results = currentResults();

    document.getElementById("results-count").textContent =

    document.getElementById("stats-line").textContent =

  function detailHtml(d) {
    var techniques = (d.mitre_attack.techniques || []).map(function (t) {
      return '<tr><td>' + esc(t.id) + '</td><td>' + esc(t.name) +
        (t.url ? ' &mdash; <a href="' + esc(t.url) + '" target="_blank" rel="noopener">attack.mitre.org</a>' : '') + '</td></tr>';
    }).join("");
    var tactics = (d.mitre_attack.tactics || []).map(function (t) { return esc(t.name); }).join(", ");

    var dataSources = (d.data_sources || []).map(function (s) {
      return '<div class="data-source-item"><span class="ds-name">' + esc(s.name) + '</span>' +
        (s.path ? '<span class="ds-path">' + esc(s.path) + '</span>' : '') +
        '<div class="ds-desc">' + esc(s.description || "") + '</div></div>';
    }).join("");

    var investigation = (d.investigation_steps || []).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join("");
    var references = (d.references || []).map(function (r) {
      return '<li><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.title) + '</a></li>';
    }).join("");
    var related = (d.related_detections || []).map(function (rid) {
      var rd = findById(rid);
      return rd ? '<span class="related-chip" data-id="' + esc(rid) + '">' + esc(rd.title) + '</span>' : "";
    }).join("");
    var tags = (d.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join("");

    return '' +
      '<div class="detail-header">' +
        '<div>' +
          '<div class="detail-title">' + esc(d.title) + '</div>' +
          '<div class="detail-badges">' +
            '<span class="badge ' + esc(d.severity) + '">' + esc(d.severity) + '</span>' +
            '<span class="tag">' + esc(d.type) + '</span>' +
            '<span class="tag">' + esc(d.method || "") + '</span>' +
            '<span class="tag">' + esc(d.platform) + '</span>' +
            (d.confidence ? '<span class="tag">Confidence: ' + esc(d.confidence) + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<button class="close-btn" id="detail-close" aria-label="Close">&times;</button>' +
      '</div>' +
      '<div class="detail-body">' +
        '<div class="detail-section"><p>' + esc(d.description) + '</p></div>' +

        '<div class="detail-section"><h4>MITRE ATT&amp;CK</h4>' +
          '<table class="kv-table"><tr><td>Tactic(s)</td><td>' + tactics + '</td></tr></table>' +
          '<table class="kv-table" style="margin-top:4px">' + techniques + '</table>' +
        '</div>' +

        '<div class="detail-section"><h4>Detection Logic</h4><p>' + esc(d.detection_logic || "") + '</p></div>' +

        (d.spl ? '<div class="detail-section"><h4>Search (Splunk SPL, adapt to your data)' +
          '</h4><div class="code-block"><button class="copy-btn" data-copy="spl">Copy</button>' + esc(d.spl) + '</div></div>' : '') +

        (d.cli_reference ? '<div class="detail-section"><h4>CLI / API Reference</h4>' +
          '<div class="code-block"><button class="copy-btn" data-copy="cli">Copy</button>' + esc(d.cli_reference) + '</div></div>' : '') +

        '<div class="detail-section"><h4>Data Sources</h4>' + dataSources + '</div>' +

        '<div class="detail-section"><h4>How to Implement</h4><p>' + esc(d.how_to_implement || "") + '</p></div>' +

        '<div class="detail-section"><h4>Known False Positives</h4><p>' + esc(d.known_false_positives || "") + '</p></div>' +

        (investigation ? '<div class="detail-section"><h4>Investigation Steps</h4><ul>' + investigation + '</ul></div>' : '') +

        (references ? '<div class="detail-section"><h4>References</h4><ul class="ref-list">' + references + '</ul></div>' : '') +

        (related ? '<div class="detail-section"><h4>Related Detections</h4>' + related + '</div>' : '') +

        (tags ? '<div class="detail-section"><h4>Tags</h4><div class="tag-row">' + tags + '</div></div>' : '') +

        '<table class="kv-table" style="margin-top:4px">' +
          '<tr><td>Analytic Story</td><td>' + esc((d.analytic_story || []).join(", ")) + '</td></tr>' +
          '<tr><td>Status</td><td>' + esc(d.status) + '</td></tr>' +
          '<tr><td>Author</td><td>' + esc(d.author) + '</td></tr>' +
          '<tr><td>Created / Modified</td><td>' + esc(d.created) + ' / ' + esc(d.modified) + '</td></tr>' +
          '<tr><td>Version</td><td>' + esc(d.version) + '</td></tr>' +
          '<tr><td>ID</td><td><code>' + esc(d.id) + '</code></td></tr>' +
        '</table>' +
      '</div>';
  }

  function openDetail(id) {
    var d = findById(id);
    if (!d) return;
    state.activeId = id;
    document.getElementById("detail-panel").innerHTML = detailHtml(d);
    var overlay = document.getElementById("overlay");
    overlay.hidden = false;
    document.getElementById("detail-panel").scrollTop = 0;
    overlay.scrollTop = 0;
    document.getElementById("detail-close").addEventListener("click", closeDetail);
    document.querySelectorAll(".related-chip").forEach(function (el) {
      el.addEventListener("click", function () { openDetail(el.getAttribute("data-id")); });
    });
    document.querySelectorAll(".copy-btn").forEach(function (el) {
      el.addEventListener("click", function () {
        var field = el.getAttribute("data-copy");
        copyToClipboard(d[field] || "");
      });
    });
    if (history.replaceState) history.replaceState(null, "", "#" + id);
  }
  function closeDetail() {
    document.getElementById("overlay").hidden = true;
    state.activeId = null;
    if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
  }
  document.getElementById("overlay").addEventListener("click", function (e) {
    if (e.target.id === "overlay") closeDetail();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDetail();
    if (e.key === "/" && document.activeElement !== document.getElementById("search-input") && !document.getElementById("overlay").hidden === false) {
      e.preventDefault();
      document.getElementById("search-input").focus();
    }
  });

  /* ---------------------------- Toast / clipboard ---------------------------- */
  var toastTimer = null;
  function showToast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1600);
  }
  function copyToClipboard(text) {
    function done(ok) { showToast(ok ? "Copied to clipboard" : "Copy failed"); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done(true);
      } catch (e) { done(false); }
    }
  }

  /* ---------------------------- Export ---------------------------- */
  document.getElementById("export-btn").addEventListener("click", function () {
    var results = currentResults();
    var blob = new Blob([JSON.stringify(results, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "threat-detection-library-export.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showToast("Exported " + results.length + " detection" + (results.length === 1 ? "" : "s"));
  });

  /* ---------------------------- Search wiring ---------------------------- */
  var searchInput = document.getElementById("search-input");
  searchInput.addEventListener("input", function () { state.query = searchInput.value.trim(); render(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  /* ---------------------------- Render / bootstrap ---------------------------- */
  function render() {
    renderSidebar();
    renderChips();
    renderGrid();
  }
  render();

  var initialId = location.hash ? decodeURIComponent(location.hash.slice(1)) : null;
  if (initialId && findById(initialId)) openDetail(initialId);
})();
</script>
</body>
</html>
